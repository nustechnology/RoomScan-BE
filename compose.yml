services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomscan}
      POSTGRES_DB: ${POSTGRES_DB:-roomscan}
    ports:
      - '5432:5432'
    volumes:
      - roomscan-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT:-127.0.0.1:9000}:9000'
      - '${MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001'
    volumes:
      - roomscan-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomscan}:${POSTGRES_PASSWORD:-roomscan}@db:5432/${POSTGRES_DB:-roomscan}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-roomscan}:${POSTGRES_PASSWORD:-roomscan}@db:5432/${POSTGRES_DB:-roomscan}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_API_WINDOW_SECONDS: ${RATE_LIMIT_API_WINDOW_SECONDS:-60}
      RATE_LIMIT_API_MAX_REQUESTS: ${RATE_LIMIT_API_MAX_REQUESTS:-120}
      RATE_LIMIT_APPLE_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_APPLE_AUTH_WINDOW_SECONDS:-900}
      RATE_LIMIT_APPLE_AUTH_MAX_REQUESTS: ${RATE_LIMIT_APPLE_AUTH_MAX_REQUESTS:-20}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-roomscan-assets}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-roomscan}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-roomscan-minio-secret}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      STORAGE_UPLOAD_URL_TTL_SECONDS: ${STORAGE_UPLOAD_URL_TTL_SECONDS:-900}
      STORAGE_DOWNLOAD_URL_TTL_SECONDS: ${STORAGE_DOWNLOAD_URL_TTL_SECONDS:-60}
      ASSET_MIN_MODEL_SIZE_BYTES: ${ASSET_MIN_MODEL_SIZE_BYTES:-10000000}
      ASSET_MAX_MODEL_SIZE_BYTES: ${ASSET_MAX_MODEL_SIZE_BYTES:-100000000}
      ASSET_MAX_THUMBNAIL_SIZE_BYTES: ${ASSET_MAX_THUMBNAIL_SIZE_BYTES:-10000000}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
      INVITATION_BASE_URL: ${INVITATION_BASE_URL:-http://localhost:3000}
    ports:
      - '${ROOMSCAN_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  roomscan-postgres-data:
  roomscan-minio-data:
