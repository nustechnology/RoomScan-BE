services:
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://roomscan:roomscan@db:5432/roomscan?schema=public}
    networks:
      - shared-network
    restart: 'no'

  roomscan:
    build:
      context: .
      target: runtime
    container_name: roomscan
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://roomscan:roomscan@db:5432/roomscan?schema=public}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SYNC_CRYPTO_KEY: ${SYNC_CRYPTO_KEY}
      RATE_LIMIT_API_WINDOW_SECONDS: ${RATE_LIMIT_API_WINDOW_SECONDS:-60}
      RATE_LIMIT_API_MAX_REQUESTS: ${RATE_LIMIT_API_MAX_REQUESTS:-120}
      RATE_LIMIT_APPLE_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_APPLE_AUTH_WINDOW_SECONDS:-900}
      RATE_LIMIT_APPLE_AUTH_MAX_REQUESTS: ${RATE_LIMIT_APPLE_AUTH_MAX_REQUESTS:-20}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_APP_STORE_ID: ${APPLE_APP_STORE_ID:-}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
      AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-roomscan-assets}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-minio:9000}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_PUBLIC_USE_SSL: ${STORAGE_PUBLIC_USE_SSL:-}
      STORAGE_UPLOAD_URL_TTL_SECONDS: ${STORAGE_UPLOAD_URL_TTL_SECONDS:-900}
      STORAGE_DOWNLOAD_URL_TTL_SECONDS: ${STORAGE_DOWNLOAD_URL_TTL_SECONDS:-60}
      ASSET_MIN_MODEL_SIZE_BYTES: ${ASSET_MIN_MODEL_SIZE_BYTES:-0}
      ASSET_MAX_MODEL_SIZE_BYTES: ${ASSET_MAX_MODEL_SIZE_BYTES:-200000000}
      ASSET_MAX_THUMBNAIL_SIZE_BYTES: ${ASSET_MAX_THUMBNAIL_SIZE_BYTES:-10000000}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
      INVITATION_BASE_URL: ${INVITATION_BASE_URL:-https://roomscan.nustechnology.com}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-RoomScan App <notifications@roomscan.app>}
    expose:
      - '4000'
    networks:
      - default
      - shared-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

networks:
  shared-network:
    name: shared-network
    external: true
