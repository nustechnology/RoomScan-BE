services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roomscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomscan}
      POSTGRES_DB: ${POSTGRES_DB:-roomscan}
    ports:
      - '5432:5432'
    volumes:
      - roomscan-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT:-127.0.0.1:9000}:9000'
      - '${MINIO_CONSOLE_PORT:-127.0.0.1:9001}:9001'
    volumes:
      - roomscan-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  roomscan-postgres-data:
  roomscan-minio-data:
